<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story - 스토리</title>
    <!-- shop.css 상단 헤더, MY 버튼, 메뉴바 고정 스타일 공유 -->
    <link rel="stylesheet" href="shop.css">
    <style>
        /* 📖 1. 기본 브라우저 스크롤 차단 및 전체 뷰포트 고정 */
        html, body {
            width: 100%;
            height: 100vh;
            margin: 0;
            padding: 0;
            background-color: #000000;
            overflow: hidden !important;
            position: relative;
        }

        /* 📖 2. 뷰포트 영역 */
        .story-viewport {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
            perspective: 1000px;
        }

        /* 📌 위치 튐 방지: X축 오프셋을 트랙 수준에서 완전히 고정 */
        .story-stack-track {
            position: absolute;
            top: 130px;
            left: 54%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            align-items: center;
            will-change: transform;
        }

        /* 📖 4. 세로 카드 행 (상단 라인 맞춤) */
        .story-card {
            width: 100%;
            margin-top: -220px;
            position: relative;
            cursor: pointer;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            gap: 35px;
            transition: transform 0.25s ease-out, filter 0.25s ease-out, opacity 0.25s ease-out;
            transform-origin: center center;
        }

        .story-card:first-child {
            margin-top: 0;
        }

        /* 👈 [메인 화면 좌측] 내지 png */
        .story-card .card-img {
            width: 600px;
            height: auto;
            display: block;
            border-radius: 4px;
            object-fit: contain;
            box-shadow: 0 -12px 35px rgba(0, 0, 0, 0.9);
        }

        /* 👉 [메인 화면 우측] 텍스트 번호 png (기본 숨김: opacity 0) */
        .story-card .card-txt {
            width: 135px;
            height: auto;
            display: block;
            object-fit: contain;
            margin-top: 5px;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        /* ✨ 마우스 올림 효과 */
        .story-card:hover .card-img {
            filter: brightness(1.1);
        }

        /* 📖 5. 스토리 전용 대형 팝업 모달 스타일 */
        .story-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.92);
            z-index: 999999;
            display: none;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .story-modal-content {
            background-color: #0a0a0a;
            border: 1px solid #222222;
            width: 1050px;
            max-width: 92%;
            max-height: 85vh;
            color: #ffffff;
            position: relative;
            padding: 45px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.95);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
        }

        .story-close-btn {
            position: absolute;
            top: 18px;
            right: 25px;
            background: none;
            border: none;
            color: #888888;
            font-size: 36px;
            cursor: pointer;
            transition: color 0.2s;
            z-index: 10;
        }

        .story-close-btn:hover { color: #ffffff; }

        .story-modal-body {
            display: flex;
            gap: 45px;
            align-items: flex-start;
            height: 100%;
            overflow: hidden;
        }

        /* 팝업 좌측: book 내지 대형 png */
        .story-modal-img-box {
            flex: 1.2;
            background-color: #000000;
            border: 1px solid #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            max-height: 70vh;
        }

        .story-modal-img-box img {
            max-width: 100%;
            max-height: 65vh;
            object-fit: contain;
        }

        /* 팝업 우측: 텍스트 번호 + 흰색 선 + 스크롤 sopho */
        .story-modal-info-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            max-height: 70vh;
        }

        .story-modal-txt-img {
            width: 160px;
            height: auto;
            display: block;
            margin-bottom: 20px;
            object-fit: contain;
        }

        .story-modal-divider {
            width: 100%;
            height: 1px;
            background-color: rgba(255, 255, 255, 0.7);
            margin-bottom: 20px;
        }

        .story-modal-description {
            flex: 1;
            overflow-y: auto;
            padding-right: 15px;
            color: #cccccc;
            font-size: 15px;
            line-height: 1.8;
            word-break: keep-all;
        }

        .story-modal-description::-webkit-scrollbar { width: 6px; }
        .story-modal-description::-webkit-scrollbar-thumb { background: #333333; border-radius: 3px; }
        .story-modal-description::-webkit-scrollbar-track { background: #111111; }
    </style>
</head>
<body>

            <div class="story-card" onclick="openStoryModal(17)"><img src="images/png/story/17.png" class="card-img" alt="Story 17"><img src="images/png/videos/h_17.png" class="card-txt" alt="Txt 17"></div>
            <div class="story-card" onclick="openStoryModal(18)"><img src="images/png/story/18.png" class="card-img" alt="Story 18"><img src="images/png/videos/h_18.png" class="card-txt" alt="Txt 18"></div>
            <div class="story-card" onclick="openStoryModal(19)"><img src="images/png/story/19.png" class="card-img" alt="Story 19"><img src="images/png/videos/h_19.png" class="card-txt" alt="Txt 19"></div>

    <!-- 📖 스토리 상세 모달 -->
    <div id="story-modal" class="story-modal-overlay" onclick="closeStoryModal(event)">
        <div class="story-modal-content" onclick="event.stopPropagation()">

                <div class="story-modal-img-box">

    <script>
        const track = document.getElementById('stackTrack');
        const cards = Array.from(document.querySelectorAll('.story-card'));
        const pageImages = Array.from(document.querySelectorAll('.card-img'));
        
        let currentY = 0;
        let targetSpeed = 0;
        let isPointerOverPageImg = false; /* 마우스가 오직 '내지 png' 위에 있는지 여부 */

        const storyDescriptions = {
            1: "중2병 때는 삶에 대해서 많이 생각해 보게 된다. 내가 무엇을 위해 공부하는지, 무엇을 위해 교복을 입고 학교를 가는지, 이 세상은 누가 만들었고 나는 어떤 존재인지... 여러가지 존재 자체의 이유에 대해 깊은 생각을 할 수 있는 시기이다.",
            2: "SNS에 느끼하고 오그라드는 글귀를 많이 작성하고, 필터가 과한 사진들을 많이 올리게 된다. SNS에서의 모습을 가꾸며 남들에게 자신이 어떻게 비춰지는 지를 중시한다.",
            3: "우주, 외계인 등 다른 차원의 존재에 대한 상상을 하며 심취하기도 한다. 여러가지 감성에 취하기도 하며, 이로 인해 상상력과 몰입, 공감 등의 감정을 잘 키워낼 수 있게 된다.",
            4: "'나는 갇혀있는가, 자유로운가?'를 생각했을 때 자기 자신이 몸은 자유로우나 어딘가에 갇혀있다고 여기기도 한다. 자신의 상황을 극단적이게 보면서 좀 더 긍정적인 상황으로 개선되도록 노력하게 되기도 한다.",
            5: "학교와 학원에서 생활하는 만큼, 학교의 시스템이나 교육에 관하여 부정적인 생각을 갖게 되기도 한다. 이러한 생각이 긍정적인 방향으로 뻗어나간다면 시스템의 문제나 부조리한 상황 속에서 갈등을 겪고 있는 사람들을 도울 수 있게 되고, 더 좋은 방향으로 시스템을 발전시켜 나갈 수도 있다.",
            6: "힙합 등 여러 문화에 빠져들기도 한다. 이로 인해 갈등이나 분노 등 깊은 감정과 부정적인 상황에서도 그 상황을 긍정적이게 취미를 살리는 방향으로 극복할 수 있게 되기도 한다. 예를 들어 친구와의 다툼이나 갈등이 발생했을 때 이를 랩 가사로 승화시켜 힙합으로 풀어내기도 한다.",
            7: "중2병 때는 이성에 관심을 많이 가지게 되는 시기이기도 하다. 모든 이성들이 자기 자신을 좋아한다는 착각에 빠지기도 하며 긍정회로를 돌리기도 한다. 어찌보면 가장 자존감이 높은 시기라고 볼 수 있다.",
            8: "우울한 짤 등이 보이면 저장하고 자신만의 감정에 빠지기도 한다. 자기연민에 빠지기 쉬우나 자기 자신을 돌봐주고 돌아볼 수 있는 계기가 되기도 한다.",
            9: "애니메이션의 영향으로 일본 문화에 관심을 가지고 취미 생활을 키우기도 한다. 무언가에 깊게 빠져 몰입할 수 있는 시기이다.",
            10: "유독 주변 사람들에게 관심을 받고자 한다. 괜히 시선을 끌만한 행동을 하고, 자기가 남들보다 더 튀고 싶어하는 경향을 보인다. 남들 앞에 잘 나서고, 자신을 어필하고 돋보이게 하는 시기이다. 자존감이 높고 자기 자신을 사랑할 수 있는 시기라는 것도 알 수 있다.",
            11: "다중인격 컨셉을 잡기도 한다. 새 학기가 시작되면 어떠한 캐릭터를 잡고 그 캐릭터처럼 생활하고 연기하기도 하면서 자기 자신을 자기가 좋아하는 캐릭터 혹은 튈 수 있는 인격으로 보이고자 한다. 페르소나를 잡고 사회에서 자기 pr을 하는 연습을 할 수 있다.",
            12: "어른스럽고 싶어서 어른들이 입을 법한 옷 스타일과 화장을 시도하기도 하고, 다른 친구들보다 더 성숙해 보이고자 한다. 이를 연기하며 실제로 성숙한 사람의 성격을 연기하기도 하면서 미숙하지만, 성숙한 사람으로 보이고자 노력한다.",
            13: "상황이 좋지 않고, 집안에서의 의견 충돌이 일어날 경우 중2병 때는 사춘기로 인한 충동성으로 가출을 시도하기도 한다. 실제로 가출을 시도해보는 학생들도 많지만 대다수는 이 경험을 통해 사회에서의 현실을 좀 더 직관적으로 알게되고, 집의 소중함과 부모님을 향한 감사한 마음을 다시금 깨닫게 되기도 한다. 사회의 현실을 배우는 시간으로 소비된다.",
            14: "새벽 늦은 시간에도 집에 들어가지 않고 친구들과 함께 놀고 싶어하는 경향을 보인다. 자유로운 생활을 꿈꾸고 자신이 원하는 것을 위해 시도하는 실행력이 보이지만, 무모하다는 점도 배우게 된다.",
            15: "자신이 남들보다 뛰어나다고 생각하는 시기이기도 하다. 실제로는 큰 격차가 없고 비슷한 결과를 내더라도 자기 자신이 가장 잘하고 뛰어나다고 생각하는 긍정적인 자신감이 넘치는 시기이다.",
            16: "올블랙 옷을 고집하고, 시크하고 튀지 않는 게 좋다고 여기기도 한다. 튀고 싶어하는 학생들과 반대로 자기 자신이 주목받지 않고 놀림받지 않고 유행에 묻어가길 워하는 학생들도 많다는 것을 알 수 있다. 혹은 자기 자신이 좋다고 여기는 패션을 고집하며 시도해 자신만의 스타일을 갈고 닦을 수 있는 시기이기도 하다.",
            17: "오글거리는 말을 많이 하는 시기이다. 인터넷에 돌아다니는 감성 글귀나 명언들을 직접 말하거나 표시하고 다니는데, 오글거려 보일 수 있어도 실제로 자신이 새기고자 하는 좌우명을 실제로 실천해 나가는 실행력을 가진 학생들이기도 하다.",
            18: "어두운 감정들을 SNS에 업로드하면서 감정을 삭히기도 한다. 나중에 되돌아보면 그때 왜 이 글을 올렸지 하고 후회하기도 하지만, 자신의 감정을 안전하게 표출하는 방식이기도 하며, 넘치는 감정을 조절할 수 있는 행위이기도 하다.",
            19: "어른들, 더 나아가 타인은 자신을 이해하지 못할 거라고 단정짓는 경우도 존재한다. 자기만의 세계에 빠져 자신을 더 집중적으로 돌아볼 수 있는 시기이기도 하다.",
            20: "사람들의 눈에 띄는 곳에서 자신을 드러내는 학생들도 있다. 장기자랑, 수련회 등의 다양한 행사에서 친구들을 재밌게 해주는 밝고 쾌활한 친구들이 이 유형에 해당하는 경우가 많다."
        };

        // 🎯 핵심: 마우스가 오직 '내지 png(.card-img)' 위에 있을 때만 감지 플래그 true
        pageImages.forEach(img => {
            img.addEventListener('mouseenter', () => {
                isPointerOverPageImg = true;
            });
            img.addEventListener('mouseleave', () => {
                isPointerOverPageImg = false;
                targetSpeed = 0;
            });
        });

        window.addEventListener('mousemove', (e) => {
            // 마우스 커서가 내지 png 영역을 벗어나면(텍스트 png, 헤더, 배경 등) 즉시 스크롤 동작 중단
            if (!isPointerOverPageImg) {
                targetSpeed = 0;
                return;
            }

            const windowHeight = window.innerHeight;
            const mouseY = e.clientY;

            const topZone = windowHeight * 0.35;
            const bottomZone = windowHeight * 0.65;

            if (mouseY > bottomZone) {
                const intensity = (mouseY - bottomZone) / (windowHeight - bottomZone);
                targetSpeed = -(intensity * 12);
            } else if (mouseY < topZone) {
                const intensity = (topZone - mouseY) / topZone;
                targetSpeed = intensity * 12;
            } else {
                targetSpeed = 0;
            }
        });

        function updateCenterFocus() {
            const viewportCenter = window.innerHeight / 2;

            cards.forEach((card) => {
                const rect = card.getBoundingClientRect();
                const cardCenter = rect.top + (rect.height / 2);
                
                const distanceFromCenter = Math.abs(viewportCenter - cardCenter);
                
                const maxRange = 350;
                let normalized = 1 - Math.min(distanceFromCenter / maxRange, 1);

                const scale = 0.85 + (normalized * 0.50);
                const zIndex = Math.round(normalized * 1000);
                
                const shadowAlpha = normalized * 0.25;
                const brightness = 0.85 + (normalized * 0.25);

                track.style.transform = `translateX(-50%) translateY(${currentY}px)`;
                card.style.transform = `scale(${scale})`;
                card.style.zIndex = zIndex;
                card.style.filter = `brightness(${brightness}) drop-shadow(0 0 15px rgba(255, 255, 255, ${shadowAlpha}))`;

                const txtImg = card.querySelector('.card-txt');
                if (txtImg) {
                    if (normalized >= 0.75) {
                        txtImg.style.opacity = '1';
                    } else {
                        txtImg.style.opacity = '0';
                    }
                }
            });
        }

        function animateLoop() {
            if (targetSpeed !== 0) {
                currentY += targetSpeed;

                const trackHeight = track.offsetHeight;
                const windowHeight = window.innerHeight;

                const minY = -(trackHeight - (windowHeight * 0.65));
                const maxY = 200;

                if (currentY < minY) currentY = minY;
                if (currentY > maxY) currentY = maxY;
            }

            updateCenterFocus();
            requestAnimationFrame(animateLoop);
        }

        function openStoryModal(num) {
            const formattedNum = num < 10 ? `0${num}` : num;
            
            document.getElementById('story-modal-page-img').src = `images/png/story/${formattedNum}.png`;
            document.getElementById('story-modal-txt-img').src = `images/png/videos/h_${num}.png`;
            document.getElementById('story-modal-desc').innerText = storyDescriptions[num] || `${formattedNum}번 내지의 상세 스토리 sopho 공간입니다.`;

            document.getElementById('story-modal').style.display = 'flex';
        }

        function closeStoryModal(event) {
            if (!event || event.target.classList.contains('story-modal-overlay') || event.target.classList.contains('story-close-btn')) {
                document.getElementById('story-modal').style.display = 'none';
            }
        }

        updateCenterFocus();
        animateLoop();
    </script>
</body>
</html>
