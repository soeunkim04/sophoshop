<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - 상점</title>
    <link rel="stylesheet" href="home.css">
    <style>
        /* 🚀 MY png 크기 및 위치 (my.html 스타일과 100% 동일하게 일치) */
         /* 🚀 my.html과 동일하게 위치와 크기를 강제 일치시키는 CSS */
         a.ui-fixed-my {
    position: fixed !important;
    top: 1vw !important;    /* my.html과 동일한 세로 위치 */
    right: 2vw !important;    /* my.html과 동일한 가로 위치 */
    z-index: 99999 !important;/* 최상단 고정 */
    display: inline-block !important;
    width: auto !important;
    height: auto !important;
    cursor: pointer;
}

a.ui-fixed-my img {
    width: 3vw !important;  /* my.html과 동일한 크기 */
    height: auto !important;  /* 비율 자동 유지 */
    max-width: none !important;
    max-height: none !important;
    display: block !important;
    transition: transform 0.2s, filter 0.2s;
}

a.ui-fixed-my img:hover {
    transform: scale(1.08);
    filter: brightness(1.2);
}

        /* 🛍️ 커머스 상세페이지 (모달 팝업) 전용 CSS */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.88);
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
        }

        .modal-content {
            background-color: #0d0d0d;
            border: 1px solid #2a2a2a;
            width: 820px;
            max-width: 90%;
            color: #ffffff;
            position: relative;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            border-radius: 4px;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            color: #888888;
            font-size: 32px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-btn:hover { color: #ffffff; }

        .modal-body {
            display: flex;
            gap: 40px;
            align-items: center;
        }

        .modal-img-box {
            flex: 1;
            background-color: #000000;
            padding: 30px;
            border: 1px solid #1f1f1f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 380px;
        }

        .modal-img-box img {
            max-width: 100%;
            max-height: 320px;
            object-fit: contain;
            filter: drop-shadow(0 5px 15px rgba(255, 255, 255, 0.1));
        }

        .modal-info-box {
            flex: 1.1;
            display: flex;
            flex-direction: column;
        }

        .brand-tag {
            font-size: 11px;
            color: #ff3300;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        #modal-title {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 12px;
            line-height: 1.2;
            word-break: keep-all;
        }

        .price-row {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 20px;
        }

        .currency {
            font-size: 13px;
            margin-left: 4px;
            color: #888888;
            font-weight: normal;
        }

        .divider {
            border: 0;
            height: 1px;
            background: #222222;
            margin-bottom: 24px;
        }

        .quantity-group {
            margin-bottom: 30px;
        }

        .quantity-group label {
            display: block;
            font-size: 11px;
            color: #888888;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .qty-control {
            display: flex;
            align-items: center;
        }

        .qty-control button {
            width: 36px;
            height: 36px;
            background: #1a1a1a;
            color: #ffffff;
            border: 1px solid #333333;
            font-size: 16px;
            cursor: pointer;
        }

        .qty-control input {
            width: 50px;
            height: 36px;
            text-align: center;
            background: #000000;
            color: #ffffff;
            border-top: 1px solid #333333;
            border-bottom: 1px solid #333333;
            border-left: none;
            border-right: none;
            font-size: 14px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .cart-btn, .buy-btn {
            flex: 1;
            padding: 16px;
            font-weight: bold;
            font-size: 13px;
            letter-spacing: 1px;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .cart-btn {
            background: #222222;
            color: #ffffff;
            border: 1px solid #333333;
        }

        .buy-btn {
            background: #ffffff;
            color: #000000;
        }

        .cart-btn:hover { background: #333333; }
        .buy-btn:hover { background: #dddddd; }

        @media (max-width: 768px) {

            .modal-content { padding: 25px; }

    /* 1. 최상위 html의 자체 스크롤바를 숨기고 바깥 여백 초기화 */
    
    html {
        margin: 0 !important;
        padding: 0 !important;
        width: 100% !important;
        height: 100% !important;
        overflow: hidden !important; /* html 차원의 스크롤바 방지 */
    }

    /* 2. body 하나만 스크롤 및 원페이지 스냅(Snap) 스크롤 허용 */
    body {
        margin: 0 !important;
        padding: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        overflow-x: hidden !important;
        overflow-y: auto !important; /* 메인 스크롤바 1개 유지 */

        scroll-snap-type: y mandatory !important; /* CSS 원페이지 슬라이딩 스냅 유지 */
        background-color: #000000;

    /* 3. 각 섹션/페이지 슬라이드 구역 스냅 설정 */
    section, .section, .home-section, .page-section {

    }

    /* 4. 내부 일반 컨테이너의 이중 스크롤만 핀포인트로 차단 */
    .home-container, .wrapper, #main-wrapper {
        overflow: visible !important;
        max-height: none !important;
    }

    <script>
        let isAnimating = false;
        let currentProduct = {};

        function scrollToElement(targetSelector) {
            const target = document.querySelector(targetSelector);
            if (!target) return;

            isAnimating = true;
            // 🛠️ 오타(-) 수정 완료
            const targetPos = target.getBoundingClientRect().top + window.pageYOffset - 150;

            window.scrollTo({
                top: targetPos,
                behavior: 'smooth'
            });

            setTimeout(() => { isAnimating = false; }, 1000);
        }

        window.addEventListener('wheel', (event) => {
            if (isAnimating) return;

            const isScrollDown = event.deltaY > 0;
            if (!isScrollDown) return;

            const currentY = window.scrollY;
            const storyTitle = document.querySelector('.txt-story-title');

            if (!storyTitle) return;

            // 🛠️ 오타(-) 수정 완료
            const storyPos = storyTitle.getBoundingClientRect().top + window.pageYOffset - 150;

            if (currentY < 150) {
                event.preventDefault();
                scrollToElement('.txt-shop-title');
            } 
            // 🛠️ 오타(-) 수정 완료
            else if (currentY >= (storyPos - 500) && currentY < (storyPos - 100)) {
                event.preventDefault();
                scrollToElement('.txt-story-title');
            }
        }, { passive: false });

        const objObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('fade-in-up');
                    entry.target.style.opacity = '1';
                } else {
                    entry.target.classList.remove('fade-in-up');
                    entry.target.style.opacity = '0';
                }
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.obj').forEach(obj => {
            if (!obj.classList.contains('txt-sophoshop') && 
                !obj.classList.contains('txt-shop-title') && 
                !obj.classList.contains('txt-poster-title') && 
                !obj.classList.contains('txt-story-title')) {
                objObserver.observe(obj);
            }
        });

        function openDetail(title, imgSrc, price) {
            currentProduct = { title, imgSrc, price };
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-img').src = imgSrc;
            document.getElementById('modal-price').innerText = price;
            document.getElementById('qty-input').value = 1;
            
            document.getElementById('product-modal').style.display = 'flex';
        }

        function closeDetail(event) {
            if (!event || event.target.classList.contains('modal-overlay') || event.target.classList.contains('close-btn')) {
                document.getElementById('product-modal').style.display = 'none';
            }
        }

        function changeQty(delta) {
            const input = document.getElementById('qty-input');
            let current = parseInt(input.value) || 1;
            current += delta;
            if (current < 1) current = 1;
            input.value = current;
        }

        function addToCart(goToBuy = false) {
            const qty = parseInt(document.getElementById('qty-input').value) || 1;
            let cart = JSON.parse(localStorage.getItem('sophoCart')) || [];

            const existingIndex = cart.findIndex(item => item.title === currentProduct.title);
            if (existingIndex > -1) {
                cart[existingIndex].qty += qty;
            } else {
                cart.push({
                    id: Date.now(),
                    title: currentProduct.title,
                    imgSrc: currentProduct.imgSrc,
                    price: currentProduct.price,
                    qty: qty
                });
            }

            localStorage.setItem('sophoCart', JSON.stringify(cart));

            if (goToBuy) {
                location.href = 'my.html';
            } else {
                if (confirm('bag에 담겼습니다. 마이페이지로 이동하시겠습니까?')) {
                    location.href = 'my.html';
                } else {
                    closeDetail();
                }
            }
        }
    </script>
